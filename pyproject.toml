[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-automation"
version = "0.1.0"
description = "AI Content Automation - Modular monolith for company-wide AI/agent/automation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AI Content", email = "dev@aicontent.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "loguru>=0.7.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "pillow>=11.0",
    "baml-py==0.226.2",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "boto3>=1.40,<2",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
    "opentelemetry-instrumentation-httpx>=0.65b0,<0.66",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<0.66",
    "opentelemetry-instrumentation-botocore>=0.65b0,<0.66",
    "prometheus-client>=0.26,<1",
    "python-multipart>=0.0.18,<1",
    "celery>=5.6,<6",
    "scrapling[fetchers]>=0.4.15,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src/ai_content/domains/marketing/creative/adapters/baml_client",
    "src/ai_content/domains/marketing/performance_decisions/adapters/baml_client",
    "src/ai_content/domains/marketing/creative_feedback/adapters/baml_client",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["ai_content"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
