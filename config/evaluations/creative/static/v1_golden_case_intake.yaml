# Golden-case intake for the Static Creative Pilot.
# This is a real-case selection matrix, not a runnable dataset, and contains no assets.
# Sanitized real assets and briefs belong outside Git under .local-data/golden/.

id: "static-creative-golden-cases"
version: "1.0-draft"
status: "awaiting_real_assets"
target_case_count: 5
initial_calibration_case_count: 3
owner_to_confirm: "content_creative_lead"
rubric_ref: "rubric-static-creative-qa@1.0-draft"
primary_brand_alias: "demohome"

selection_rules:
  same_brand: true
  same_primary_channel: true
  require_usage_permission: true
  require_fixed_brief: true
  require_product_truth: true
  prefer_existing_human_decision: true
  exclude_sensitive_or_customer_data: true

cases:
  - case_id: "GC-01-product-fidelity-baseline"
    difficulty: "easy"
    purpose: "Measure product preservation in a simple composition."
    preferred_source: "A completed Static task with little copy and one clear product image."
    must_include:
      - "Original product asset"
      - "Fixed brief"
      - "Lead-approved or rejected output with a reason"
    stress: ["product_fidelity", "product_salience"]
    observed_candidate_alias: "SINLKICF133TBNA-live-edge-design"
    evidence_status: "pending_real_case"

  - case_id: "GC-02-lifestyle-reference"
    difficulty: "medium"
    purpose: "Measure product placement in a home or lifestyle scene using a reference and persona."
    preferred_source: "A task with an authorized Pinterest or competitor reference and a clear setting requirement."
    must_include:
      - "Original product asset"
      - "At least one authorized reference"
      - "Persona, angle, and visual direction"
      - "Output and lead feedback when available"
    stress: ["composition_and_reference_fit", "persona_and_brand_fit", "visual_naturalness"]
    observed_candidate_alias: "SILDTCS009TBNA-fits-every-style"
    evidence_status: "pending_real_case"

  - case_id: "GC-03-copy-offer-proof"
    difficulty: "medium"
    purpose: "Measure heading, offer, proof, call-to-action, and safe-zone accuracy."
    preferred_source: "A previously run or approved headliner, benefit call-out, or infographic task."
    must_include:
      - "Exact required copy"
      - "Offer and proof source"
      - "Banned claims"
      - "Placement and output specification"
      - "Output and human decision"
    stress: ["fact_and_claim_accuracy", "required_copy_accuracy", "visual_hierarchy_and_readability"]
    observed_candidate_alias: null
    evidence_status: "pending_real_case"

  - case_id: "GC-04-wide-banner-recomposition"
    difficulty: "hard"
    purpose: "Measure 16:9 recomposition while preserving product and brand fidelity."
    preferred_source: "A website-banner case matching the observed 16:9 reference-search bottleneck."
    must_include:
      - "Original product asset"
      - "Wide-layout reference"
      - "Brand and style constraints"
      - "Text and crop safe zones"
      - "Output and lead feedback when available"
    stress: ["technical_and_placement", "composition_and_reference_fit", "product_fidelity"]
    observed_candidate_alias: null
    evidence_status: "pending_real_case"

  - case_id: "GC-05-creative-set-diversity"
    difficulty: "hard"
    purpose: "Measure variation-set quality rather than isolated image quality."
    preferred_source: "A multi-variation Static brief with a previously reviewed output set."
    must_include:
      - "Required count and direction for each variation"
      - "Shared product truth, persona, angle, offer, and objective"
      - "Every output in the set"
      - "Asset-level and set-level decisions or feedback when available"
    stress: ["set_complete", "set_no_duplicate", "set_coverage", "set_consistency"]
    observed_candidate_alias: "SILDTTNCF012TBNA-natural-beauty"
    evidence_status: "pending_real_case"

required_case_fields:
  - "brand_alias"
  - "sku_alias"
  - "objective"
  - "idea_id_or_alias"
  - "fixed_brief"
  - "product_asset_paths"
  - "reference_asset_paths"
  - "approved_claims_and_proof"
  - "banned_claims"
  - "output_spec"
  - "source_asset_permission"
  - "historical_candidate_paths"
  - "historical_human_decision"
  - "historical_feedback"
