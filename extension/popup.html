<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo">A</span>
        <div>
          <strong>AIC Collector <span id="version" class="version"></span></strong>
          <small id="status">Sent 0 packages to the collector</small>
        </div>
      </div>
      <label class="switch" title="Send data to the collector while you browse pages yourself">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
        <span class="switch-label">Collect while browsing</span>
      </label>
    </header>

    <section class="card hero">
      <h2>1. Collect TikTok Shop products</h2>
      <p class="hint">Log in and solve any captcha on TikTok Shop first, then press the button below.</p>
      <div class="row">
        <label class="field">
          <span>Tab song song</span>
          <input type="number" id="auto-tabs" value="3" min="1" max="5" />
        </label>
        <label class="field">
          <span>Max products</span>
          <input type="number" id="auto-limit" min="1" max="5000" placeholder="all" />
        </label>
      </div>
      <button id="auto" class="primary">Scroll the list, then collect the details</button>
      <div id="auto-note" class="note"></div>
      <div id="walker-bar" class="bar" hidden><span></span></div>
      <div id="walker" class="progress"></div>
      <button id="stop" class="ghost danger">Stop</button>
    </section>

    <section class="card">
      <h2>2. Pinterest reference images</h2>
      <p class="hint">Log in to Pinterest first. Leave both boxes empty to collect everything.</p>
      <div class="row">
        <label class="field">
          <span>Keywords</span>
          <input type="number" id="pin-searches" min="1" max="200" placeholder="all" />
        </label>
        <label class="field">
          <span>Images per keyword</span>
          <input type="number" id="pin-images" min="10" max="2000" placeholder="all" />
        </label>
      </div>
      <button id="pins" class="primary">Collect Pinterest images for approved keywords</button>
      <div id="pin-bar" class="bar" hidden><span></span></div>
      <div id="pin-walker" class="progress"></div>
      <button id="pin-stop" class="ghost danger" hidden>Stop</button>
    </section>

    <details class="card">
      <summary>Manual</summary>
      <button id="capture" class="secondary">Capture this page</button>
      <button id="harvest" class="secondary">Scroll the list page only (15 rounds)</button>
      <div class="row">
        <label class="field">
          <span>Products</span>
          <input type="number" id="count" value="20" min="1" max="200" />
        </label>
      </div>
      <button id="start" class="secondary">Fetch from the collector and run one tab at a time</button>
    </details>

    <details class="card">
      <summary>Export data</summary>
      <div class="row">
        <button id="xlsx" class="secondary">Excel</button>
        <button id="json" class="secondary">JSON</button>
      </div>
      <button id="media" class="secondary">Download images/videos to this computer</button>
      <div id="media-status" class="note"></div>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
