<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo">A</span>
        <div>
          <strong>AIC Collector</strong>
          <small id="status">Đã gửi 0 gói về collector</small>
        </div>
      </div>
      <label class="switch" title="Gửi dữ liệu về collector khi bạn tự duyệt trang">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
        <span class="switch-label">Tự thu khi duyệt</span>
      </label>
    </header>

    <section class="card hero">
      <h2>1. Lấy sản phẩm TikTok Shop</h2>
      <p class="hint">Đăng nhập và giải captcha trên trang TikTok Shop trước, rồi bấm nút dưới.</p>
      <div class="row">
        <label class="field">
          <span>Tab song song</span>
          <input type="number" id="auto-tabs" value="3" min="1" max="5" />
        </label>
        <label class="field">
          <span>Tối đa sản phẩm</span>
          <input type="number" id="auto-limit" value="50" min="1" max="500" />
        </label>
      </div>
      <button id="auto" class="primary">Cuộn lấy danh sách, rồi cào chi tiết</button>
      <div id="auto-note" class="note"></div>
      <div id="walker" class="progress"></div>
      <button id="stop" class="ghost danger">Dừng</button>
    </section>

    <section class="card">
      <h2>2. Ảnh tham chiếu Pinterest</h2>
      <p class="hint">Đăng nhập Pinterest trước. Để trống hai ô để lấy hết.</p>
      <div class="row">
        <label class="field">
          <span>Số từ khóa</span>
          <input type="number" id="pin-searches" min="1" max="200" placeholder="tất cả" />
        </label>
        <label class="field">
          <span>Ảnh mỗi từ khóa</span>
          <input type="number" id="pin-images" min="10" max="2000" placeholder="hết" />
        </label>
      </div>
      <button id="pins" class="primary">Crawl Pinterest theo từ khóa đã duyệt</button>
    </section>

    <details class="card">
      <summary>Thủ công</summary>
      <button id="capture" class="secondary">Capture trang này</button>
      <button id="harvest" class="secondary">Chỉ cuộn trang danh sách (15 lượt)</button>
      <div class="row">
        <label class="field">
          <span>Số sản phẩm</span>
          <input type="number" id="count" value="20" min="1" max="200" />
        </label>
      </div>
      <button id="start" class="secondary">Lấy từ collector và chạy từng tab</button>
    </details>

    <details class="card">
      <summary>Xuất dữ liệu</summary>
      <div class="row">
        <button id="xlsx" class="secondary">Excel</button>
        <button id="json" class="secondary">JSON</button>
      </div>
      <button id="media" class="secondary">Tải ảnh/video về máy</button>
      <div id="media-status" class="note"></div>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
