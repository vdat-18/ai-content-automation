# Turns on a login for the dashboard and the API. Set in deploy/.env:
#   AIC_NGINX_AUTH_CONF=./nginx/auth.example.conf
#   AIC_NGINX_HTPASSWD=./nginx/htpasswd
# and make the user file with:
#   docker run --rm httpd:2.4 htpasswd -nbB <user> <password> > deploy/nginx/htpasswd
auth_basic "AI Content";
auth_basic_user_file /etc/nginx/htpasswd;
