global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: aicontent-api
    metrics_path: /internal/metrics/
    static_configs:
      - targets: [api:8000]

  - job_name: aicontent-worker
    static_configs:
      - targets: [worker:9464]
