x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: ${AIC_LANGFUSE_PUBLIC_URL:-http://localhost:3001}
  DATABASE_URL: >-
    postgresql://langfuse:${AIC_LANGFUSE_POSTGRES_PASSWORD:?set AIC_LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
  SALT: ${AIC_LANGFUSE_SALT:?set AIC_LANGFUSE_SALT}
  ENCRYPTION_KEY: ${AIC_LANGFUSE_ENCRYPTION_KEY:?set AIC_LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${AIC_LANGFUSE_CLICKHOUSE_PASSWORD:?set AIC_LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${AIC_LANGFUSE_REDIS_PASSWORD:?set AIC_LANGFUSE_REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${AIC_LANGFUSE_MINIO_ACCESS_KEY:?set AIC_LANGFUSE_MINIO_ACCESS_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${AIC_LANGFUSE_MINIO_SECRET_KEY:?set AIC_LANGFUSE_MINIO_SECRET_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${AIC_LANGFUSE_MINIO_ACCESS_KEY:?set AIC_LANGFUSE_MINIO_ACCESS_KEY}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${AIC_LANGFUSE_MINIO_SECRET_KEY:?set AIC_LANGFUSE_MINIO_SECRET_KEY}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    environment:
      <<: *langfuse-environment
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    profiles: [langfuse]

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${AIC_LANGFUSE_NEXTAUTH_SECRET:?set AIC_LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_INIT_ORG_ID: ${AIC_LANGFUSE_INIT_ORG_ID:-aicontent}
      LANGFUSE_INIT_ORG_NAME: AI Content
      LANGFUSE_INIT_PROJECT_ID: ${AIC_LANGFUSE_INIT_PROJECT_ID:-marketing-ai}
      LANGFUSE_INIT_PROJECT_NAME: Marketing AI
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${AIC_AI_LANGFUSE_PUBLIC_KEY:?set AIC_AI_LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${AIC_AI_LANGFUSE_SECRET_KEY:?set AIC_AI_LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${AIC_LANGFUSE_INIT_USER_EMAIL:?set AIC_LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${AIC_LANGFUSE_INIT_USER_NAME:?set AIC_LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${AIC_LANGFUSE_INIT_USER_PASSWORD:?set AIC_LANGFUSE_INIT_USER_PASSWORD}
    ports:
      - "${AIC_LANGFUSE_BIND_ADDRESS:-127.0.0.1}:${AIC_LANGFUSE_PORT:-3001}:3000"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://$$(hostname):3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal
    restart: unless-stopped
    profiles: [langfuse]

  langfuse-postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${AIC_LANGFUSE_POSTGRES_PASSWORD:?set AIC_LANGFUSE_POSTGRES_PASSWORD}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal
    restart: unless-stopped
    profiles: [langfuse]

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${AIC_LANGFUSE_CLICKHOUSE_PASSWORD:?set AIC_LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal
    restart: unless-stopped
    profiles: [langfuse]

  langfuse-redis:
    image: redis:7.4-bookworm
    command:
      - redis-server
      - --requirepass
      - ${AIC_LANGFUSE_REDIS_PASSWORD:?set AIC_LANGFUSE_REDIS_PASSWORD}
      - --maxmemory-policy
      - noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$AIC_LANGFUSE_REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      AIC_LANGFUSE_REDIS_PASSWORD: ${AIC_LANGFUSE_REDIS_PASSWORD:?set AIC_LANGFUSE_REDIS_PASSWORD}
    networks:
      - internal
    restart: unless-stopped
    profiles: [langfuse]

  langfuse-minio:
    image: cgr.dev/chainguard/minio:latest
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: ${AIC_LANGFUSE_MINIO_ACCESS_KEY:?set AIC_LANGFUSE_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${AIC_LANGFUSE_MINIO_SECRET_KEY:?set AIC_LANGFUSE_MINIO_SECRET_KEY}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal
    restart: unless-stopped
    profiles: [langfuse]

volumes:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_postgres_data:
  langfuse_redis_data:
