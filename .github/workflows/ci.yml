name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # Same image as `just test`, so ffmpeg, fonts and library versions match local runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dummy env (compose needs values; the tests use none of them)
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^AIC_POSTGRES_PASSWORD=$/AIC_POSTGRES_PASSWORD=ci-dummy/' deploy/.env
          sed -i 's/^AIC_AI_S3_ACCESS_KEY=$/AIC_AI_S3_ACCESS_KEY=ci-dummy/' deploy/.env
          sed -i 's/^AIC_AI_S3_SECRET_KEY=$/AIC_AI_S3_SECRET_KEY=ci-dummy/' deploy/.env
      - name: Lint
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml --profile tools run --rm --build test ruff check src tests
      - name: Test
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml --profile tools run --rm test python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test extension/tests/background.test.cjs
